name: release

# Pushing a tag such as v0.1.0 publishes the sagand binaries to GitHub Releases
# and then the CLI to npm. The tag must match cli/package.json's version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches cli/package.json
        run: |
          want="$(node -p "require('./cli/package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "tag $GITHUB_REF_NAME does not match version $want"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Nothing is published unless both suites pass on the tagged commit. The
      # CLI suite also checks that src/version.ts matches package.json.
      - name: Agent tests
        working-directory: agent
        run: go test -race ./...
      - name: CLI tests
        working-directory: cli
        run: npm ci && npm test

  agent:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    # After the agent: `sagansync provision` downloads the release published above.
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # npm authorizes this workflow through the trusted publisher set up on
      # npmjs.com, so no npm token is stored in the repository. A version
      # already on npm is skipped, so this job can be re-run on its own when
      # it fails after the GitHub release went out.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "sagansync@$version" version 2>/dev/null)" ]; then
            echo "sagansync@$version is already on npm"
            exit 0
          fi
          # A pre-release such as 0.2.0-rc.1 must not become "latest".
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
