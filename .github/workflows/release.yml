name: release

# Pushing a tag such as v0.1.0 publishes the sagand binaries to GitHub Releases
# and then the CLI to npm. The tag must match cli/package.json's version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches cli/package.json
        run: |
          want="$(node -p "require('./cli/package.json').version")"
          test "${GITHUB_REF_NAME#v}" = "$want" || { echo "tag $GITHUB_REF_NAME does not match version $want"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Nothing is published unless both suites pass on the tagged commit. The
      # CLI suite also checks that src/version.ts matches package.json.
      - name: Agent tests
        working-directory: agent
        run: go test -race ./...
      - name: CLI tests
        working-directory: cli
        run: npm ci && npm test

  agent:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    # After the agent: `sagansync provision` downloads the release published above.
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
